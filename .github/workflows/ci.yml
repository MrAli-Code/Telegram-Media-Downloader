name: Build and Test

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Tests (Windows, Python 3.11)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov ruff pyinstaller

      - name: Lint (ruff)
        run: ruff check .

      - name: Run tests
        env:
          QT_QPA_PLATFORM: offscreen
          PYTHONUTF8: "1"
        run: pytest tests -q

  build:
    name: Build Windows EXE
    runs-on: windows-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Generate icons
        run: python scripts/make_icon.py

      - name: Build one-file EXE
        env:
          PYTHONUTF8: "1"
        run: |
          python -m PyInstaller --noconfirm --clean distpath dist build/telegram_downloader_onefile.spec

      - name: Smoke test (boot 20s)
        shell: pwsh
        run: |
          $exe = Get-ChildItem -Path dist -Filter *.exe | Select-Object -First 1
          $p = Start-Process -FilePath $exe.FullName -PassThru
          Start-Sleep -Seconds 20
          if ($p.HasExited) { throw "EXE exited early with code $($p.ExitCode)" }
          Stop-Process -Id $p.Id -Force
          Write-Host "smoke ok"

      - uses: actions/upload-artifact@v4
        with:
          name: telegram-downloader-windows
          path: dist/*.exe
          retention-days: 14
